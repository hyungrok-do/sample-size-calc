name: Lean deployment
on:
  push:
    branches: [main]
    paths: ['packaging/lean/**', 'packaging/lean-wasm/**', 'lean/**', 'scripts/*lean*', 'core/**', 'CMakeLists.txt', 'web/**', '.github/workflows/lean-deployment.yml']
  pull_request:
    paths: ['packaging/lean/**', 'packaging/lean-wasm/**', 'lean/**', 'scripts/*lean*', 'core/**', 'CMakeLists.txt', 'web/**', '.github/workflows/lean-deployment.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for Lean and Docker image layers
        run: |
          # This disposable runner does not use Android, .NET, Haskell, or CodeQL.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Validate deployment configuration
        env:
          SSC_DOMAIN: localhost
          SSC_PASSWORD_HASH: unused-during-configuration-validation
        run: |
          docker compose -f packaging/lean/compose.yaml config --format json > /tmp/ssc-compose.json
          python - <<'PY'
          import json
          config = json.load(open('/tmp/ssc-compose.json'))
          mounts = config['services']['compiler']['tmpfs']
          assert len(mounts) == 1 and mounts[0].startswith('/tmp:'), mounts
          PY
          python scripts/check_lean_deployment.py
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned Lean worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/lean/Dockerfile
          target: lean-worker
          tags: ssc-lean-worker:local
          load: true
          cache-from: type=gha,scope=lean-worker
          cache-to: type=gha,scope=lean-worker,mode=max
      - name: Build hosted web application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/lean/Dockerfile
          target: gateway
          tags: ssc-lean-web:local
          build-args: SITE_VERSION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=lean-gateway
          cache-to: type=gha,scope=lean-gateway,mode=max
      - name: Test real container compilation and isolation
        run: python scripts/check_lean_deployment.py --docker
      - name: Start HTTPS deployment
        env:
          SSC_DOMAIN: localhost
          SSC_USERNAME: researcher
        run: |
          export SSC_PASSWORD_HASH="$(docker run --rm caddy:2.10.2-alpine caddy hash-password --plaintext ci-compiler-password)"
          docker compose -f packaging/lean/compose.yaml up --no-build -d compiler https
          python - <<'PY'
          import base64, json, ssl, time, urllib.request, urllib.error
          tls = ssl._create_unverified_context()
          auth = 'Basic ' + base64.b64encode(b'researcher:ci-compiler-password').decode()
          for attempt in range(30):
              try:
                  req = urllib.request.Request('https://localhost/api/lean/health', headers={'Authorization': auth})
                  with urllib.request.urlopen(req, context=tls, timeout=5) as response:
                      assert json.load(response)['ready']
                  break
              except (OSError, AssertionError):
                  time.sleep(2)
          else:
              raise SystemExit('HTTPS deployment did not become ready')
          try:
              urllib.request.urlopen('https://localhost/lean.html', context=tls)
              raise AssertionError('Unauthenticated access was accepted')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          for name in ['ssc_web', 'ssc_web_mt']:
              req = urllib.request.Request(f'https://localhost/engine/{name}.wasm', headers={'Authorization': auth})
              with urllib.request.urlopen(req, context=tls) as response:
                  assert response.read(4) == b'\x00asm'
          print('HTTPS, authentication, readiness, and both WASM engines passed.')
          PY
      - name: Legacy compiler through the authenticated HTTPS API
        run: |
          python - <<'PYTEST'
          import base64, json, pathlib, ssl, urllib.request, urllib.error, uuid
          auth = 'Basic ' + base64.b64encode(b'researcher:ci-compiler-password').decode()
          tls = ssl._create_unverified_context()  # The loopback test uses Caddy's local CA.
          source = pathlib.Path('examples/lean-studies/repeated-measures.lean').read_text()
          def compile(source):
              request = urllib.request.Request('https://localhost/api/lean/compile',
                  data=json.dumps({'source': source, 'jobId': str(uuid.uuid4())}).encode(),
                  headers={'Authorization': auth, 'Origin': 'https://localhost', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, context=tls, timeout=180) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)
          status, result = compile(source)
          assert status == 200 and result['ok'], result
          assert result['results'][0]['evaluation']['selectedN'] == 51
          status, result = compile('theorem invalid : False := by sorry\n' + source)
          assert status >= 400 and not result['ok'], result
          print('Authenticated HTTPS API compiles legacy source and rejects an unproved claim.')
          PYTEST
      - name: Deployment logs
        if: failure()
        run: |
          df -h /
          docker system df
          docker logs sample-size-lean-compiler-1 || true
          docker logs sample-size-lean-https-1 || true
      - name: Stop deployment
        if: always()
        env:
          SSC_DOMAIN: localhost
          SSC_PASSWORD_HASH: unused-during-shutdown
        run: docker compose -f packaging/lean/compose.yaml down --volumes
