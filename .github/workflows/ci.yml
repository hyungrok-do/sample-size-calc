name: CI

# Debug branch only: why WebKit keeps no offline copies (web/tests/sw-debug.mjs).  The engines are committed here
# (built locally) so the job needs no Emscripten build.
on:
  push:

permissions:
  contents: read

jobs:
  webkit-debug:
    name: Service worker caches in webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser
        run: |
          npm ci --prefix web
          cd web
          npx playwright install-deps webkit
          for attempt in 1 2 3; do
            timeout 300 npx playwright install webkit && break
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Diagnose
        run: |
          web/assemble.sh "$RUNNER_TEMP/site" "dbg-${GITHUB_SHA::7}"
          cd web && SSC_BROWSER=webkit node tests/sw-debug.mjs "$RUNNER_TEMP/site"
