name: CI

# Debug branch only: why WebKit keeps no offline copies (web/tests/sw-debug.mjs).  The engines are committed here
# (built locally) so the job needs no Emscripten build.
on:
  push:

permissions:
  contents: read

jobs:
  webkit-debug:
    name: Service worker caches in webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser
        run: |
          npm ci --prefix web
          cd web
          npx playwright install-deps webkit
          for attempt in 1 2 3; do
            timeout 300 npx playwright install webkit && break
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Whether the copies are lost to writes still under way when the network goes down
        timeout-minutes: 45
        run: |
          web/assemble.sh "$RUNNER_TEMP/site" "dbg-${GITHUB_SHA::7}"
          web/assemble.sh "$RUNNER_TEMP/site-once" "dbg-${GITHUB_SHA::7}"
          python3 web/tests/put-once.py "$RUNNER_TEMP/site-once"
          cd web
          for config in "site:" "site:settle" "site-once:"; do
            dir=${config%%:*}; variant=${config#*:}
            pass=0; fail=0
            for run in 1 2 3 4 5 6 7 8; do
              if SSC_BROWSER=webkit VARIANT=$variant timeout 240 node tests/site-variant.mjs "$RUNNER_TEMP/$dir" > /tmp/out.txt 2>&1; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1)); grep -m1 -o '"status": "[^"]*"' /tmp/out.txt || tail -3 /tmp/out.txt
              fi
            done
            echo "=== $dir ${variant:-as is}: $pass passed, $fail failed"
          done
