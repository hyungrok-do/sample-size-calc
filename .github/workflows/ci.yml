name: CI

# Debug branch only: why WebKit keeps no offline copies (web/tests/sw-debug.mjs).  The engines are committed here
# (built locally) so the job needs no Emscripten build.
on:
  push:

permissions:
  contents: read

jobs:
  webkit-debug:
    name: Service worker caches in webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser
        run: |
          npm ci --prefix web
          cd web
          npx playwright install-deps webkit
          for attempt in 1 2 3; do
            timeout 300 npx playwright install webkit && break
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Which part of the site test loses the copies
        timeout-minutes: 40
        run: |
          web/assemble.sh "$RUNNER_TEMP/site" "dbg-${GITHUB_SHA::7}"
          cd web
          for variant in "" nostored nolink noetag nolink,noetag,nostored; do
            pass=0; fail=0; first=""
            for run in 1 2 3 4 5; do
              if out=$(SSC_BROWSER=webkit VARIANT=$variant timeout 240 node tests/site-variant.mjs "$RUNNER_TEMP/site" 2>&1); then
                pass=$((pass + 1))
              else
                fail=$((fail + 1)); [ -z "$first" ] && first=$(echo "$out" | grep -v '^Site:' | head -c 1500)
              fi
            done
            echo "=== variant '${variant:-as is}': $pass passed, $fail failed"
            [ -n "$first" ] && echo "$first"
          done
